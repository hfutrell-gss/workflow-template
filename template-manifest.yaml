# template-manifest.yaml — the CORE pack's manifest.
#
# A workflow repo is composed from packs (see AGENTS.CORE.md "Composition"). This file
# is the manifest of the one pack that is not optional: the core, which defines the
# shapes every other pack plugs into. Additional packs declare the same thing in a
# `pack.yaml` at their root, with `provides:` in place of `managed:`.
#
# `update` copies ONLY these paths forward from upstream when the upstream's VERSION is
# ahead of a derivation's `.template.lock` `template_version`, and touches nothing
# outside the list. A path REMOVED from this list is deleted from every derivation on
# its next update — the derivation's own copy of this file is the record of what the
# core previously owned.
#
# This file is itself managed, which is what lets a future core version add or retire a
# managed path everywhere.

version: 32  # mirrors this repo's VERSION at the time this manifest last changed
             # VERSION is a plain integer; comparison uses sort -n.

managed:
  - AGENTS.CORE.md
  # Managed workflows: the core ships workflows, not only skills
  # (AGENTS.CORE.md "The shapes"). Only the TIMELESS half is managed -- a derivation's
  # applications, carried work, and sessions under this workflow are its own data and
  # are never overwritten by update.
  - workflows/upstream-workflow-management/SKILL.md
  - workflows/upstream-workflow-management/references/**
  - .claude/skills/upstream-workflow-management/SKILL.md
  - VOICE.md
  - GLOSSARY.md
  - CLAUDE.md
  - template-manifest.yaml
  # Canonical skill bodies + scripts (proxy rule: .claude is a proxy for .agents).
  # These are MECHANISM: the shapes, and the operations on them. Engineering opinion is
  # not here -- it ships as the optional `code-craft` pack (pack-code-craft), installed with
  # `template-sync.sh add`. A workflow repo with no packs is complete, not degraded.
  - .agents/skills/workflow-init/**
  - .agents/skills/workflow-agents-sync/**
  - .agents/skills/workflow-check/**
  - .agents/skills/workflow-template-sync/**
  - .agents/skills/workflow-manage/**
  - .agents/skills/workflow-bind/**
  - .agents/skills/workflow-gateway/**
  # Task-based orchestration. Managed, but tier→lane preference and role→tier overrides
  # live in the derivation-owned overlay .agents/orchestrate/roster.local.yaml, and its
  # run state in workflows/ — none of it managed, none touched by `update`.
  - .agents/skills/workflow-orchestrate/**
  # Discovery-frontmatter proxy stubs — Claude Code needs these under .claude/skills/
  # to find each skill; each stub's body only points at its canonical file above.
  - .claude/skills/workflow-init/SKILL.md
  - .claude/skills/workflow-agents-sync/SKILL.md
  - .claude/skills/workflow-check/SKILL.md
  - .claude/skills/workflow-template-sync/SKILL.md
  - .claude/skills/workflow-manage/SKILL.md
  - .claude/skills/workflow-bind/SKILL.md
  - .claude/skills/workflow-gateway/SKILL.md
  - .claude/skills/workflow-orchestrate/SKILL.md
