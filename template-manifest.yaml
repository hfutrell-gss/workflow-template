# template-manifest.yaml — the managed set.
#
# Exactly the paths `workflow-template-sync` owns in a derivation. `update` copies ONLY
# these paths forward from upstream when the upstream's VERSION is ahead of a
# derivation's `.template.lock` `template_version` (and never touches anything outside
# this list, in this file or elsewhere). `derive` writes `.template.lock` pointing back
# at wherever this file's repo was copied/cloned from.
#
# This file is itself managed: a derivation gets it kept in sync too, and it's what
# lets a future template version add or retire a managed path in every derivation.

version: 8   # mirrors this repo's VERSION at the time this manifest last changed
             # VERSION is a plain integer; comparison uses sort -n.

managed:
  - AGENTS.CORE.md
  - CLAUDE.md
  - template-manifest.yaml
  # Canonical skill bodies + scripts (proxy rule: .claude is a proxy for .agents).
  - .agents/skills/workflow-init/**
  - .agents/skills/workflow-agents-sync/**
  - .agents/skills/workflow-template-sync/**
  - .agents/skills/workflow-manage/**
  - .agents/skills/workflow-bind/**
  # Discovery-frontmatter proxy stubs — Claude Code needs these under .claude/skills/
  # to find each skill; each stub's body only points at its canonical file above.
  - .claude/skills/workflow-init/SKILL.md
  - .claude/skills/workflow-agents-sync/SKILL.md
  - .claude/skills/workflow-template-sync/SKILL.md
  - .claude/skills/workflow-manage/SKILL.md
  - .claude/skills/workflow-bind/SKILL.md
