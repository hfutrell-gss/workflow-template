# archunit.properties — verified against archunit-junit5 1.4.2.
#
# FreezingArchRule (com.tngtech.archunit.library.freeze) behavior:
# - First run of a rule against an empty/missing store: always passes. Whatever
#   violations exist right now are captured as the frozen baseline.
# - Later runs: fail only on violations NOT already in the baseline (new violations).
#   Pre-existing, un-fixed violations do not fail the build.
# - A violation that disappears (its offending code got fixed) is pruned from the
#   baseline automatically on the next passing run — the store self-shrinks by default.
#
# Store layout: a directory (default archunit_store/) holding one index file
# (stored.rules) plus one file per frozen rule. Commit this directory to VCS — it is the
# committed enforcement baseline, not a disposable cache.

# Where the freeze store lives, relative to the working directory the tests run from.
freeze.store.default.path=archunit_store

# Whether a missing store may be created on first run. true = a new rule gets baselined
# automatically instead of failing because no store exists yet.
freeze.store.default.allowStoreCreation=true

# Whether the store may be updated (baseline rewritten, fixed violations pruned) by a
# later run. Defaults to true. Set false in CI if the baseline must only change via a
# deliberate, reviewed commit rather than silently on any green run.
freeze.store.default.allowStoreUpdate=true

# Force a full re-freeze: discard the existing baseline and re-capture current
# violations as the new baseline. Use only for a deliberate reset, never as a standing
# setting — leaving this true would mean nothing is ever actually gated.
freeze.refreeze=false

# How a stored violation line is matched against a current violation line (e.g. to
# tolerate line-number drift from unrelated edits). Leave unset for the default matcher
# unless violations fail to prune after code that only moved, and did not change,
# behavior.
# freeze.lineMatcher=
