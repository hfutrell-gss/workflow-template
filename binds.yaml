# binds.yaml — this workflow's bind registry.
#
# Two bind types (see AGENTS.CORE.md "Bind law"):
#   standing binds — repos related to this workflow, declared below with the
#                    relationship (kind + why). A registry, not a session state.
#   session binds  — repos actually attached to the *current* session, via
#                    `/add-dir` or `claude --add-dir` at launch. `/workflow-bind`
#                    attaches every standing bind marked `default: true`, plus
#                    anything else requested.
#
# `/workflow-manage` administers this file (add/remove/edit entries, sync-binds.sh).
# `/workflow-agents-sync` scope 2 checks every standing bind present on disk under
# `base` for a conforming AGENTS.md/CLAUDE.md bridge.

base: ./workspace
# The substrate workspace: where standing-bind repos actually get cloned/refreshed on
# disk (see AGENTS.CORE.md "The workspace"). Resolution rule:
#   - starts with `/` or `~`  → absolute / home-relative path (legacy form, still
#     supported) — this means operating on repos wherever that path points, which is
#     discouraged unless you specifically mean a shared checkout outside this repo.
#   - anything else            → resolved RELATIVE TO THIS WORKFLOW REPO'S ROOT (the
#     directory containing this binds.yaml). `./workspace` is the norm: a per-machine,
#     gitignored directory this workflow owns and clones its standing binds into. A
#     workflow should manage its own repos here, never reach into the user's personal
#     checkouts.

standing: []
# standing:
#   - repo: identity                                  # directory name under `base`
#     kind: reference                                  # reference | co-change | stewarded | upstream | downstream
#     why: Canonical identity graph this workflow's procedures read but never write.
#     default: false                                   # true = /workflow-bind attaches it automatically
#     url: git@github-example:example-org/identity.git # optional — enables sync-binds.sh
#     branch: main                                     # optional — branch to track/clone
